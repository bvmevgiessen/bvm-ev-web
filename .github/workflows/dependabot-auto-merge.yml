name: Dependabot auto-approve and merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Dependabot pull request number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  approve-and-enable-auto-merge:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Approve and enable auto-merge for Dependabot pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          author=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json author --jq '.author.login')
          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "::error::PR #$PR_NUMBER is not authored by dependabot[bot]."
            exit 1
          fi
          gh pr review "$PR_NUMBER" --repo "$REPOSITORY" --approve
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --merge
