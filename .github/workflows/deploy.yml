name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
      - 'design/*'
      - 'design/**'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Calculate base path for Vite
        id: base-path
        run: |
          # With custom domain bvm-ev.de:
          # - Main branch deploys to root: base path is "/"
          # - Design/feature branches deploy to subdirectories: base path is "/${{ github.ref_name }}/"
          
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "VITE_BASE_PATH=/" >> $GITHUB_ENV
            echo "dest=." >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
          else
            echo "VITE_BASE_PATH=/${{ github.ref_name }}/" >> $GITHUB_ENV
            echo "dest=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

      - name: Build production static files
        run: |
          npm run build
          # Create copy for SPA routing fallback on GitHub Pages
          cp dist/index.html dist/404.html
          # Create CNAME file for custom domain if deploying to main
          if [ "${{ steps.base-path.outputs.is_main }}" = "true" ]; then
            echo "bvm-ev.de" > dist/CNAME
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Deploy main branch to the root, and feature branches to subdirectories
          destination_dir: ${{ steps.base-path.outputs.dest }}
          # Keep other branches' deployed files so they don't overwrite each other
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
