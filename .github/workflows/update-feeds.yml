name: Update Partner Feeds & Deploy

# ---------------------------------------------------------------------------
# Fetches the latest posts from partner RSS feeds once a day, commits the
# refreshed `src/data/latest_updates.json` and re-deploys the site to GitHub
# Pages. Can also be triggered manually from the Actions tab.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Daily at 05:00 UTC  (~ 06:00 CET / 07:00 CEST)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write   # to commit the JSON update
  pages: write
  id-token: write

# Avoid clashing with the regular Deploy workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright (Chromium for JS-rendered sources)
        run: python -m playwright install --with-deps chromium

      - name: Fetch partner feeds
        run: python scripts/fetch_feeds.py

      - name: Commit refreshed feed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/latest_updates.json
          if git diff --staged --quiet; then
            echo "No feed changes – skipping commit."
          else
            git commit -m "chore(feeds): refresh latest_updates.json"
            git push
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
