name: Update Partner Feeds & Deploy

# ---------------------------------------------------------------------------
# Fetches the latest posts from partner RSS feeds once a day, commits the
# refreshed `src/data/latest_updates.json` and re-deploys the site to GitHub
# Pages. Can also be triggered manually from the Actions tab.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Daily at 05:00 UTC  (~ 06:00 CET / 07:00 CEST)
    - cron: '0 5 * * *'
  workflow_dispatch:

# Restrict workflow-level permissions to none by default for maximum security.
permissions: {}

# Avoid clashing with the regular Deploy workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      # Required to check out code and push refreshed RSS data to latest_updates.json.
      contents: write
      # Required to create or update pull requests
      pull-requests: write
      # Required to deploy GitHub Pages and authenticate with OIDC.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright (Chromium for JS-rendered sources)
        run: python -m playwright install --with-deps chromium

      - name: Fetch partner feeds
        run: python scripts/fetch_feeds.py

      - name: Create Pull Request or push refreshed feed data
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(feeds): refresh latest_updates.json"
          title: "chore(feeds): refresh latest_updates.json"
          body: "Automated daily refresh of partner feeds."
          branch: "automated-feed-update"
          delete-branch: true

      - name: Set up Node
        uses: actions/setup-node@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
