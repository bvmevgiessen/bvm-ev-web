name: Newsletter PDF aktualisieren

# Regenerates the three-month newsletter PDF and commits it into the repo, so
# GitHub Pages always serves a fresh /newsletter-latest.pdf even if the backend
# is asleep. Optionally mails the new issue to all confirmed subscribers.
#
# SETUP
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#        NEWSLETTER_API   = https://newsletter.bvm-ev.de   (your deployed backend origin)
#      Optional, only if you want the automatic mail-out:
#        NEWSLETTER_SEND  = true
#   2. Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions"
#      AND enable "Allow GitHub Actions to create and approve pull requests"
#      (needed as fallback when main is a protected branch).
#   3. If main has branch protection ("Changes must be made through a pull request"):
#      the workflow automatically opens a pull request instead of pushing directly.
#      For fully automatic merging either
#        a) add "github-actions" as bypass actor in the branch protection rule, or
#        b) enable "Allow auto-merge" in Settings -> General (merge happens once
#           required checks pass; required reviews still need a human).
#
# The schedule below runs on the 1st of every month at 06:00 UTC.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      months:
        description: "Berichtszeitraum in Monaten"
        required: false
        default: "3"
      send_mails:
        description: "Ausgabe an alle bestätigten Abonnenten senden (true/false)"
        required: false
        default: "false"

permissions: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Volle Historie, damit git pull --rebase zuverlässig funktioniert
          fetch-depth: 0

      - name: Ausgabe neu erzeugen (Daten + Editorial + PDF)
        env:
          API: ${{ secrets.NEWSLETTER_API }}
          MONTHS: ${{ github.event.inputs.months || '3' }}
        run: |
          set -euo pipefail
          if [ -z "${API:-}" ]; then
            echo "::error::Secret NEWSLETTER_API ist nicht gesetzt."
            exit 1
          fi
          echo "Baue Newsletter für ${MONTHS} Monate …"
          curl -sS --fail-with-body -X POST "${API}/api/newsletter/build" \
            -H 'Content-Type: application/json' \
            -d "{\"months\": ${MONTHS}, \"use_ai_editorial\": true}" \
            -o build.json
          python -c "import json;d=json.load(open('build.json'));print('Ausgabe:',d['issue_title'],'|',d['issue_period'],'|',len(d['events']),'Events,',len(d['blogs']),'Blogs,',d['pdf_pages'],'Seiten')"

      - name: PDF herunterladen
        env:
          API: ${{ secrets.NEWSLETTER_API }}
        run: |
          set -euo pipefail
          mkdir -p public
          curl -sS --fail-with-body "${API}/api/newsletter/download" -o public/newsletter-latest.pdf
          file public/newsletter-latest.pdf
          test -s public/newsletter-latest.pdf

      - name: PDF committen (direkt oder per Pull Request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/newsletter-latest.pdf
          if git diff --staged --quiet; then
            echo "Keine Änderung am PDF."
            exit 0
          fi
          git commit -m "chore(newsletter): PDF automatisch aktualisiert"

          BRANCH="${GITHUB_REF_NAME:-main}"
          PROTECTED=false

          # 1) Direkter Push – funktioniert, wenn main nicht geschützt ist
          #    (oder der Bot die Schutzregel umgehen darf).
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}" >push.log 2>&1; then
              cat push.log
              echo "Direkter Push erfolgreich (Versuch ${attempt})."
              exit 0
            fi
            cat push.log
            if grep -qi "GH006\|protected branch" push.log; then
              echo "Branch '${BRANCH}' ist geschützt – wechsle auf Pull-Request-Verfahren."
              PROTECTED=true
              break
            fi
            echo "Push abgelehnt (non-fast-forward) – hole Remote-Änderungen (Versuch ${attempt}) …"
            git pull --rebase -X theirs origin "${BRANCH}"
            sleep 5
          done

          if [ "${PROTECTED}" != "true" ]; then
            echo "::error::Push nach 3 Versuchen fehlgeschlagen."
            exit 1
          fi

          # 2) Pull-Request-Verfahren für geschützte Branches
          PR_BRANCH="newsletter/pdf-update-${GITHUB_RUN_ID}"
          git branch -m "${PR_BRANCH}"
          git push origin "HEAD:${PR_BRANCH}"
          PR_URL=$(gh pr create \
            --base "${BRANCH}" \
            --head "${PR_BRANCH}" \
            --title "chore(newsletter): PDF automatisch aktualisiert" \
            --body "Automatisch erzeugte Newsletter-Ausgabe (public/newsletter-latest.pdf), erstellt vom Workflow newsletter-pdf.yml.")
          echo "Pull Request erstellt: ${PR_URL}"

          # Versuche sofort zu mergen; falls Checks/Reviews nötig sind,
          # aktiviere Auto-Merge (Repo-Einstellung "Allow auto-merge" nötig).
          if gh pr merge "${PR_URL}" --squash --delete-branch >/dev/null 2>&1; then
            echo "PR automatisch gemergt."
          elif gh pr merge "${PR_URL}" --squash --auto --delete-branch >/dev/null 2>&1; then
            echo "Auto-Merge aktiviert – PR wird gemergt, sobald alle Bedingungen erfüllt sind."
          else
            echo "::warning::PR konnte nicht automatisch gemergt werden – bitte manuell mergen: ${PR_URL}"
          fi

      - name: An Abonnenten senden (optional)
        if: ${{ github.event.inputs.send_mails == 'true' || vars.NEWSLETTER_SEND == 'true' }}
        env:
          API: ${{ secrets.NEWSLETTER_API }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST "${API}/api/newsletter/send-issue" \
            -H 'Content-Type: application/json' -d '{"attach_pdf": true}' -o send.json
          python -c "import json;d=json.load(open('send.json'));print('Versendet:',d['sent'],'| Fehler:',d['failed'])"