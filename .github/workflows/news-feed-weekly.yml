name: News Feeds (wöchentlich)

# Wöchentliche Aktualisierung der Vereins-News aus scripts/aktuelles_seed.json
# und Aktualisierung von news.json & aktuelles_feeds.json.

on:
  schedule:
    # Jeden Montag um 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: news-feeds-weekly
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build News feeds
        run: python scripts/build_aktuelles_feeds.py --sections news

      - name: Commit & push (direkt oder per Pull Request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/aktuelles_feeds.json src/data/aktuelles_feeds.json public/data/news.json src/data/news.json || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "chore(news): wöchentliches News-Feed-Update"

          BRANCH="${GITHUB_REF_NAME:-main}"
          PROTECTED=false

          # 1) Direkter Push – funktioniert, wenn main nicht geschützt ist
          if git push origin "HEAD:$BRANCH" 2>&1 | tee /tmp/push.log; then
            echo "Direkter Push auf $BRANCH erfolgreich."
            exit 0
          else
            if grep -qE "GH006|protected branch|Protected branch" /tmp/push.log; then
              echo "Branch $BRANCH ist geschützt (GH006). Weiche auf Pull Request aus..."
              PROTECTED=true
            else
              echo "Push fehlgeschlagen mit unerwartetem Fehler:"
              cat /tmp/push.log
              exit 1
            fi
          fi

          # 2) Fallback: Auf Arbeits-Branch pushen und Pull Request öffnen
          if [ "$PROTECTED" = true ]; then
            PR_BRANCH="news/weekly-update-${GITHUB_RUN_ID}"
            echo "Erstelle Arbeits-Branch $PR_BRANCH..."
            git checkout -b "$PR_BRANCH"
            git push -u origin "$PR_BRANCH"

            echo "Öffne Pull Request..."
            PR_URL=$(gh pr create \
              --base "$BRANCH" \
              --head "$PR_BRANCH" \
              --title "chore(news): wöchentliches News-Feed-Update" \
              --body "Automatisches wöchentliches Update der Vereinsnachrichten (news.json & aktuelles_feeds.json). Erstellt durch GitHub Actions Run ${GITHUB_RUN_ID}.")

            echo "Pull Request erstellt: $PR_URL"

            # Auto-Merge versuchen, falls aktiviert
            gh pr merge "$PR_URL" --squash --auto || true
          fi