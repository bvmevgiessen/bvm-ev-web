name: Aktuelles Feeds (monatlich & bei Datenänderung)

# Baut monatlich sowie bei Änderungen an events.json, blogs.json oder News
# die Aktuelles-Feeds (News + Events aus events.json + Blogs aus blogs.json)
# und committet data/aktuelles_feeds.json. Der Deploy-Workflow
# veröffentlicht die Seite anschließend beim Push auf main.

on:
  schedule:
    # Am 1. jedes Monats um 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'design/*'
      - 'design/**'
    paths:
      - 'src/data/events.json'
      - 'public/data/events.json'
      - 'scripts/aktuelles_seed.json'
      - 'src/data/blogs.json'
      - 'public/data/blogs.json'
      - 'scripts/build_aktuelles_feeds.py'

permissions: {}

concurrency:
  group: aktuelles-feeds
  cancel-in-progress: false

jobs:
  update-aktuelles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Volle Historie, damit git pull --rebase zuverlässig funktioniert
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build Aktuelles feeds
        run: python scripts/build_aktuelles_feeds.py

      - name: Sync build fallback
        run: cp public/data/aktuelles_feeds.json src/data/aktuelles_feeds.json

      - name: Commit & push (direkt oder per Pull Request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/aktuelles_feeds.json src/data/aktuelles_feeds.json public/data/events.json src/data/events.json public/data/news.json src/data/news.json || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            COMMIT_MSG="chore(aktuelles): Feed-Update nach Änderung an Quelldaten"
          else
            COMMIT_MSG="chore(aktuelles): monatliches Feed-Update"
          fi
          git commit -m "${COMMIT_MSG}"

          BRANCH="${GITHUB_REF_NAME:-main}"
          PROTECTED=false

          # 1) Direkter Push – funktioniert, wenn main nicht geschützt ist
          #    (oder der Bot die Schutzregel umgehen darf).
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}" >push.log 2>&1; then
              cat push.log
              echo "Direkter Push erfolgreich (Versuch ${attempt})."
              exit 0
            fi
            cat push.log
            if grep -qi "GH006\|protected branch" push.log; then
              echo "Branch '${BRANCH}' ist geschützt – wechsle auf Pull-Request-Verfahren."
              PROTECTED=true
              break
            fi
            echo "Push abgelehnt (non-fast-forward) – hole Remote-Änderungen (Versuch ${attempt}) …"
            git pull --rebase -X theirs origin "${BRANCH}"
            sleep 5
          done

          if [ "${PROTECTED}" != "true" ]; then
            echo "::error::Push nach 3 Versuchen fehlgeschlagen."
            exit 1
          fi

          # 2) Pull-Request-Verfahren für geschützte Branches
          PR_BRANCH="aktuelles/feeds-update-${GITHUB_RUN_ID}"
          git branch -m "${PR_BRANCH}"
          git push origin "HEAD:${PR_BRANCH}"
          PR_URL=$(gh pr create \
            --base "${BRANCH}" \
            --head "${PR_BRANCH}" \
            --title "${COMMIT_MSG}" \
            --body "Automatisch erzeugtes Update der Aktuelles-Feeds (public/data/aktuelles_feeds.json und src/data/aktuelles_feeds.json), ausgelöst durch ${GITHUB_EVENT_NAME:-Workflow}.")
          echo "Pull Request erstellt: ${PR_URL}"

          # Versuche sofort zu mergen; falls Checks/Reviews nötig sind,
          # aktiviere Auto-Merge (Repo-Einstellung "Allow auto-merge" nötig).
          if gh pr merge "${PR_URL}" --squash --delete-branch >/dev/null 2>&1; then
            echo "PR automatisch gemergt."
          elif gh pr merge "${PR_URL}" --squash --auto --delete-branch >/dev/null 2>&1; then
            echo "Auto-Merge aktiviert – PR wird gemergt, sobald alle Bedingungen erfüllt sind."
          else
            echo "::warning::PR konnte nicht automatisch gemergt werden – bitte manuell mergen: ${PR_URL}"
          fi