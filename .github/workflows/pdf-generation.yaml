name: Generate Quarterly PDF Newsletter

on:
  schedule:
    # Run at 00:00 on the 1st of Jan, Apr, Jul, Oct.
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fpdf

      - name: Generate PDF
        run: python generate_pdf.py

      - name: Check for changes
        id: git-check
        run: |
          git add public/assets/pdf/newsletter-latest.pdf
          git diff --staged --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: auto-generate quarterly newsletter PDF [skip ci]"
          git push
