name: JusticeSquare Reports/Infografiken/Multimedia (monatlich)

# Aktualisiert monatlich die kuratierten Bereiche Reports, Infografiken und
# Multimedia (aus scripts/justice_seed.json) sowie deren "Letzte Aktualisierung".
# Redaktionelle Pflege erfolgt in scripts/justice_seed.json.

on:
  schedule:
    # Am 1. jedes Monats um 05:45 UTC
    - cron: '45 5 1 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: justice-feeds
  cancel-in-progress: false

jobs:
  update-monthly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Volle Historie, damit git pull --rebase zuverlässig funktioniert
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser==6.0.11 beautifulsoup4==4.12.3 lxml

      - name: Refresh reports / infographics / multimedia
        run: python scripts/fetch_justice_feeds.py --sections monthly

      - name: Sync build fallback
        run: cp public/data/justice_feeds.json src/data/justice_feeds.json

      - name: Commit & push (direkt oder per Pull Request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/justice_feeds.json src/data/justice_feeds.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "chore(justice): monatliches Reports/Infografiken/Multimedia-Update"

          BRANCH="${GITHUB_REF_NAME:-main}"
          PROTECTED=false

          # 1) Direkter Push – funktioniert, wenn main nicht geschützt ist
          #    (oder der Bot die Schutzregel umgehen darf).
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}" >push.log 2>&1; then
              cat push.log
              echo "Direkter Push erfolgreich (Versuch ${attempt})."
              exit 0
            fi
            cat push.log
            if grep -qi "GH006\|protected branch" push.log; then
              echo "Branch '${BRANCH}' ist geschützt – wechsle auf Pull-Request-Verfahren."
              PROTECTED=true
              break
            fi
            echo "Push abgelehnt (non-fast-forward) – hole Remote-Änderungen (Versuch ${attempt}) …"
            git pull --rebase -X theirs origin "${BRANCH}"
            sleep 5
          done

          if [ "${PROTECTED}" != "true" ]; then
            echo "::error::Push nach 3 Versuchen fehlgeschlagen."
            exit 1
          fi

          # 2) Pull-Request-Verfahren für geschützte Branches
          PR_BRANCH="justice/monthly-update-${GITHUB_RUN_ID}"
          git branch -m "${PR_BRANCH}"
          git push origin "HEAD:${PR_BRANCH}"
          PR_URL=$(gh pr create \
            --base "${BRANCH}" \
            --head "${PR_BRANCH}" \
            --title "chore(justice): monatliches Reports/Infografiken/Multimedia-Update" \
            --body "Automatisch erzeugtes Update der JusticeSquare Reports/Infografiken (public/data/justice_feeds.json und src/data/justice_feeds.json), erstellt vom Workflow justice-feeds-monthly.yml.")
          echo "Pull Request erstellt: ${PR_URL}"

          # Versuche sofort zu mergen; falls Checks/Reviews nötig sind,
          # aktiviere Auto-Merge (Repo-Einstellung "Allow auto-merge" nötig).
          if gh pr merge "${PR_URL}" --squash --delete-branch >/dev/null 2>&1; then
            echo "PR automatisch gemergt."
          elif gh pr merge "${PR_URL}" --squash --auto --delete-branch >/dev/null 2>&1; then
            echo "Auto-Merge aktiviert – PR wird gemergt, sobald alle Bedingungen erfüllt sind."
          else
            echo "::warning::PR konnte nicht automatisch gemergt werden – bitte manuell mergen: ${PR_URL}"
          fi
